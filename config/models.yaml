# ============================================================
#  模型配置文件
#  ============================================================
#  本文件定义所有可用模型，每个模型包含：
#    - name        : 模型唯一标识（格式：provider/model-name）
#    - display_name: 显示名称
#    - provider    : 后端提供商（openai | anthropic | gemini | deepseek 等）
#    - endpoint    : API 端点（留空则使用默认值）
#    - api_key     : API Key（支持环境变量占位符 ${ENV_VAR}）
#    - model_id    : 后端模型 ID（可能与 name 不同）
#    - context_length: 上下文窗口大小
#    - supports_tools: 是否支持工具调用（function calling）
#    - supports_vision: 是否支持多模态（图像输入）
#    - supports_streaming: 是否支持流式输出
#    - default_max_tokens: 默认最大 Token 数
#    - enabled: 是否启用
# ============================================================

models:
  # ── OpenAI 系列 ──────────────────────────────────────────

  - name: "openai/gpt-4o"
    display_name: "GPT-4o"
    provider: "openai"
    endpoint: ""           # 默认 https://api.openai.com/v1
    api_key: "${OPENAI_API_KEY}"
    model_id: "gpt-4o"
    context_length: 128000
    supports_tools: true
    supports_vision: true
    supports_streaming: true
    default_max_tokens: 4096
    enabled: true

